<head>

<link rel="stylesheet" href="https://w0ts.github.io/site-style/common.css">
<style>
/* the root page: no accent of its own; each project card carries its site's accent (data-accent re-resolves --accent-text) */
:root { --accent: #67d0ca; --accent-text-l: #247570; --accent-text-d: #67d0ca; }
.titlebar > h1 { background: #a3a29b; } .titlebar::after { background: linear-gradient(90deg, #a3a29b, transparent); }
.grid.cards { --min: 420px; margin-bottom: var(--sp-3); } @media (max-width: 900px) { .grid.cards { --min: 280px; } }
.proj { position: relative; border-left: 4px solid var(--accent); margin: 0; }
.proj:hover { background: var(--hover); }
.proj h2 { margin: 0; color: var(--accent-text); }
.proj h2 a { color: inherit; text-decoration: none; } .proj h2 a::after { content: ""; position: absolute; inset: 0; }
</style>
</head>
<body>
<main>
  <header class="site"><div class="titlebar"><h1>w0ts</h1></div><nav class="site" aria-label="Links"><a href="https://github.com/w0ts">github.com/w0ts</a></nav></header>

  <div class="grid cards">
    <section class="proj" data-accent style="--accent: #ff8a1e; --accent-text-l: #a3530a; --accent-text-d: #ff8a1e">
      <h2><a href="https://w0ts.github.io/Track-Kommander/">Track Kommander</a></h2>
    </section>

    <section class="proj" data-accent style="--accent: #287cff; --accent-text-l: #1a52b8; --accent-text-d: #287cff">
      <h2><a href="https://w0ts.github.io/optimist/">Optimist</a></h2>
    </section>

    <section class="proj" data-accent style="--accent: #9770c6; --accent-text-l: #8253ba; --accent-text-d: #a380d0">
      <h2><a href="https://w0ts.github.io/jank/">jank</a></h2>
    </section>

    <section class="proj" data-accent style="--accent: #67d0ca; --accent-text-l: #247570; --accent-text-d: #67d0ca">
      <h2><a href="https://w0ts.github.io/dn2-wishes/">DN2 Wishes</a></h2>
    </section>
  </div>


  <footer class="site">w0ts. Trademarks belong to their owners; none of these projects is affiliated with M-VAVE, Elektron, Native Instruments or Ableton.</footer>
</main>
</body>
</html>
