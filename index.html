<style>
/* the root page: no accent of its own; each project card carries its site's accent (data-accent re-resolves --accent-text) */
:root { --accent: #67d0ca; --accent-text-l: #247570; --accent-text-d: #67d0ca; }
header.site nav.site a { color: var(--ink); } /* GitHub icon: plain ink (black light, near-white dark), not an accent */
header.site .titlebar > h1 { background: #a3a29b; } header.site .titlebar::after { background: linear-gradient(90deg, #a3a29b, transparent); }
/* the project list: one bar a line, A to Z, each the usual title bar (solid accent block with the name, then the fade) in its project's accent; the whole bar is the link */
.cards { display: flex; flex-direction: column; margin-bottom: var(--sp-3); }
.proj { position: relative; }
.proj > h2 { flex: 0 1 auto; max-width: calc(100% - 32px); min-width: 0; margin: 0; padding: 8px 18px 8px 16px; background: var(--accent); color: var(--on);
  border-radius: var(--r) 0 0 var(--r); font-size: 28px; line-height: 1.15; overflow-wrap: anywhere; }
@media (max-width: 480px) { .proj > h2 { font-size: 21px; padding: 7px 12px; } }
.proj > h2 a { color: inherit; text-decoration: none; } .proj > h2 a::after { content: ""; position: absolute; inset: 0; }
.proj:hover > h2 a { text-decoration: underline; text-underline-offset: 4px; }
</style>
